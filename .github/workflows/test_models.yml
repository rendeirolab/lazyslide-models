name: Test LazySlide Models
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Where to run model tests
        type: choice
        options:
          - hf-jobs
          - github
        default: hf-jobs
      models:
        description: hf-jobs only. Comma-separated --models list (empty = all shards)
        type: string
        default: plip
      full:
        description: hf-jobs only. Shard the whole registry (ignore models)
        type: boolean
        default: false
      gpu:
        description: Also run CUDA jobs (l4x1 slide encoders + Astral flash-attn wheel; t4-small cellpose and cytosyn smoke generate 20 steps)
        type: boolean
        default: false
      sha:
        description: Commit to test on hf-jobs (empty = this workflow SHA)
        type: string
        default: ""
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  pull_request:
    paths:
      - '.github/workflows/test_models.yml'
      - 'src/lazyslide_models/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/ci_hf_job.sh'
      - 'scripts/ci_model_shards.py'

# Testing every model downloads tens of GB, so a superseded run is expensive to
# leave running. There is deliberately no `push` trigger: a merge would re-run
# exactly what the pull request just ran, and the weekly schedule covers drift
# on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HOME: /home/runner/.cache/huggingface
  HF_XET_HIGH_PERFORMANCE: "1"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # tests/, packaging, core modules, this workflow, or the HF job payload
  # select the whole registry (#19). tests/test_ci_model_shards.py is dropped
  # after the match so a helper-only diff stays selective.
  FAILSAFE_DIFF: '^(tests/|pyproject.toml|uv.lock|src/lazyslide_models/(base|_model_registry|_repr|_utils|_version|__init__)\.py|\.github/workflows/test_models\.yml|scripts/ci_hf_job\.sh|scripts/ci_model_shards\.py)'
  GPU_SLIDE_MODELS: gigapath-slide-encoder,gigapath-flash-slide-encoder
  GPU_SEG_GEN_MODELS: cellpose,cytosyn

jobs:
  # Emergency fallback only. Sunday and PRs use HF Jobs.
  test-models:
    name: Test models
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.backend == 'github'
    runs-on: linux-cpu8-300g
    steps:
      - name: Check User Permission
        id: checkAccess
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.triggering_actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abort if unauthorized
        if: steps.checkAccess.outputs.require-result == 'false'
        run: |
          echo "${{ github.triggering_actor }} does not have permissions on this repo."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore HuggingFace cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ github.run_id }}
          restore-keys: hf-models

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml

      - name: Install development dependencies
        run: uv sync --dev --group model

      - name: Show transformers version
        run: uv run --no-sync python -c "import transformers; print(f'transformers=={transformers.__version__}')"

      - name: Run model tests
        run: |
          uv run --no-sync pytest tests/ \
            -n auto \
            --dist loadgroup \
            --maxfail=3 \
            --cov=lazyslide_models \
            --cov-report=xml \
            -v

      - name: Save HuggingFace cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ github.run_id }}

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: models

  decide:
    name: Decide HF Jobs mode
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.backend == 'hf-jobs')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      pytest_args: ${{ steps.plan.outputs.pytest_args }}
      splits: ${{ steps.plan.outputs.splits }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check User Permission
        id: checkAccess
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.triggering_actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abort if unauthorized
        if: steps.checkAccess.outputs.require-result == 'false'
        run: |
          echo "${{ github.triggering_actor }} does not have permissions on this repo."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan shards or a single Job
        id: plan
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          BASE_SHA=""
          PYTEST_ARGS=""
          MODE=selective
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=sharded
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            PYTEST_ARGS="--changed-since ${BASE_SHA}"
            CHANGED="$(git diff --name-only "${BASE_SHA}...HEAD")"
            FAILSAFE_FILES="$(printf '%s\n' "${CHANGED}" | grep -E "${FAILSAFE_DIFF}" || true)"
            FAILSAFE_FILES="$(printf '%s\n' "${FAILSAFE_FILES}" | grep -v '^tests/test_ci_model_shards.py$' || true)"
            FAILSAFE_FILES="$(printf '%s\n' "${FAILSAFE_FILES}" | sed '/^$/d')"
            if [ -n "${FAILSAFE_FILES}" ]; then
              MODE=sharded
            fi
          else
            SHA="${{ github.event.inputs.sha }}"
            if [ -z "${SHA}" ]; then
              SHA="${{ github.sha }}"
            fi
            if [ "${{ github.event.inputs.full }}" = "true" ]; then
              MODE=sharded
            else
              MODELS="${{ github.event.inputs.models }}"
              if [ -z "${MODELS}" ]; then
                MODE=sharded
              else
                PYTEST_ARGS="--models ${MODELS}"
              fi
            fi
          fi
          PLAN="$(python3 scripts/ci_model_shards.py)"
          SPLITS="$(python3 -c "import json,sys; print(json.load(sys.stdin)['splits'])" <<< "${PLAN}")"
          SHARDS='[]'
          if [ "${MODE}" = "sharded" ]; then
            SHARDS="$(python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['shards'], separators=(',', ':')))" <<< "${PLAN}")"
          fi
          echo "HF Jobs mode=${MODE} sha=${SHA} splits=${SPLITS}"
          {
            echo "mode=${MODE}"
            echo "sha=${SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "pytest_args=${PYTEST_ARGS}"
            echo "splits=${SPLITS}"
            echo "shards<<SHARD_EOF"
            echo "${SHARDS}"
            echo "SHARD_EOF"
          } >> "${GITHUB_OUTPUT}"

  test-models-hf:
    name: Test models (HF Jobs)
    needs: decide
    if: needs.decide.outputs.mode == 'selective'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Run model tests on Hugging Face Jobs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN secret is empty; cannot start a Job." >&2
            exit 1
          fi
          echo "HF Jobs flavor=cpu-upgrade timeout=30m sha=${{ needs.decide.outputs.sha }}"
          uvx --from huggingface_hub hf jobs run \
            --namespace RendeiroLab \
            --flavor cpu-upgrade \
            --timeout 30m \
            --secrets HF_TOKEN \
            --env "CI_SHA=${{ needs.decide.outputs.sha }}" \
            --env "CI_BASE_SHA=${{ needs.decide.outputs.base_sha }}" \
            --env "CI_PYTEST_ARGS=${{ needs.decide.outputs.pytest_args }}" \
            ghcr.io/astral-sh/uv:python3.12-bookworm \
            bash -c "$(cat scripts/ci_hf_job.sh)"

  test-models-hf-sharded:
    name: Test models (HF Jobs ${{ matrix.shard.id }})
    needs: decide
    if: needs.decide.outputs.mode == 'sharded'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.decide.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Run shard on Hugging Face Jobs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN secret is empty; cannot start a Job." >&2
            exit 1
          fi
          echo "HF Jobs flavor=cpu-upgrade pytest-split group=${{ matrix.shard.group }}/${{ needs.decide.outputs.splits }}"
          HF_JOB=(
            uvx --from huggingface_hub hf jobs run
            --namespace RendeiroLab
            --flavor cpu-upgrade
            --timeout 30m
            --secrets HF_TOKEN
            --env "CI_SHA=${{ needs.decide.outputs.sha }}"
            --env "CI_XDIST_WORKERS=1"
            --env "CI_PYTEST_ARGS=--splits ${{ needs.decide.outputs.splits }} --group ${{ matrix.shard.group }}"
          )
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HF_JOB+=(
              --env "CI_CODECOV=1"
              --env "CODECOV_TOKEN=${{ secrets.CODECOV_TOKEN }}"
            )
          fi
          "${HF_JOB[@]}" \
            ghcr.io/astral-sh/uv:python3.12-bookworm \
            bash -c "$(cat scripts/ci_hf_job.sh)"

  test-models-hf-gpu-slide:
    name: Test models (HF Jobs GPU slide)
    needs: decide
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.gpu == 'true' && github.event.inputs.backend == 'hf-jobs')
    runs-on: ubuntu-latest
    # Queue can sit for a long time; the 25m cap is on the next step, after Running.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Queue until l4x1 is running
        id: queue
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN secret is empty; cannot start a Job." >&2
            exit 1
          fi
          SHA="${{ needs.decide.outputs.sha }}"
          if [ -z "${SHA}" ]; then
            SHA="${{ github.sha }}"
          fi
          echo "HF Jobs flavor=l4x1 models=${GPU_SLIDE_MODELS} sha=${SHA}"
          # --detach stdout is a human banner; the Job ID is the 24-char hex.
          JOB_OUT="$(uvx --from huggingface_hub hf jobs run \
            --detach \
            --namespace RendeiroLab \
            --flavor l4x1 \
            --timeout 20m \
            --name lazyslide-models-gpu-slide \
            --secrets HF_TOKEN \
            --env "CI_SHA=${SHA}" \
            --env "CI_DEVICE=cuda" \
            --env "CI_INSTALL_FLASH_ATTN=1" \
            --env "CI_XDIST_WORKERS=1" \
            --env "CI_PYTEST_ARGS=--models ${GPU_SLIDE_MODELS} --device cuda" \
            nvidia/cuda:13.0.1-runtime-ubuntu24.04 \
            bash -c "$(cat scripts/ci_hf_job.sh)")"
          JOB_ID="$(printf '%s\n' "${JOB_OUT}" | grep -Eo '[a-fA-F0-9]{24}' | head -1)"
          if ! printf '%s' "${JOB_ID}" | grep -Eq '^[a-fA-F0-9]{24}$'; then
            echo "hf jobs run --detach did not print a Job ID (got: ${JOB_OUT})" >&2
            exit 1
          fi
          echo "job_id=${JOB_ID}" >> "${GITHUB_OUTPUT}"
          echo "https://huggingface.co/jobs/RendeiroLab/${JOB_ID}"
          # JobStage is only SCHEDULING/RUNNING plus terminals (COMPLETED, CANCELED, ERROR, DELETED).
          while true; do
            STAGE="$(uvx --from huggingface_hub python -c "from huggingface_hub import inspect_job; print(inspect_job(job_id='${JOB_ID}', namespace='RendeiroLab').status.stage)")"
            echo "stage=${STAGE}"
            case "${STAGE}" in
              RUNNING|COMPLETED) break ;;
              CANCELED|ERROR|DELETED) exit 1 ;;
            esac
            sleep 15
          done

      - name: Run CUDA slide-encoder tests on l4x1
        timeout-minutes: 25
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JOB_ID: ${{ steps.queue.outputs.job_id }}
        run: |
          set -euo pipefail
          JOB_REF="RendeiroLab/${JOB_ID}"
          uvx --from huggingface_hub hf jobs logs -f "${JOB_REF}"
          uvx --from huggingface_hub hf jobs wait --timeout 20m "${JOB_REF}"

  test-models-hf-gpu-seg:
    name: Test models (HF Jobs GPU cellpose)
    needs: decide
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.gpu == 'true' && github.event.inputs.backend == 'hf-jobs')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Run CUDA cellpose and cytosyn tests on t4-small
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN secret is empty; cannot start a Job." >&2
            exit 1
          fi
          SHA="${{ needs.decide.outputs.sha }}"
          if [ -z "${SHA}" ]; then
            SHA="${{ github.sha }}"
          fi
          echo "HF Jobs flavor=t4-small models=${GPU_SEG_GEN_MODELS} sha=${SHA}"
          uvx --from huggingface_hub hf jobs run \
            --namespace RendeiroLab \
            --flavor t4-small \
            --timeout 40m \
            --secrets HF_TOKEN \
            --env "CI_SHA=${SHA}" \
            --env "CI_DEVICE=cuda" \
            --env "CI_XDIST_WORKERS=1" \
            --env "CI_PYTEST_ARGS=--models ${GPU_SEG_GEN_MODELS} --device cuda" \
            pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel \
            bash -c "$(cat scripts/ci_hf_job.sh)"
