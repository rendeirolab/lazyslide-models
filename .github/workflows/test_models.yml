name: Test LazySlide Models
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Where to run model tests
        type: choice
        options:
          - github
          - hf-jobs
        default: github
      models:
        description: hf-jobs only. Comma-separated --models list (empty = all)
        type: string
        default: plip
      sha:
        description: Commit to test on hf-jobs (empty = this workflow SHA)
        type: string
        default: ""
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  pull_request:
    paths:
      - '.github/workflows/test_models.yml'
      - 'src/lazyslide_models/**'
      - 'tests/**'
      - 'pyproject.toml'

# Testing every model downloads tens of GB, so a superseded run is expensive to
# leave running. There is deliberately no `push` trigger: a merge would re-run
# exactly what the pull request just ran, and the weekly schedule covers drift
# on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HOME: /home/runner/.cache/huggingface
  # Enable fast Xet-based downloads when available
  HF_XET_HIGH_PERFORMANCE: "1"
  # HF_TOKEN is read natively by huggingface_hub — no login step needed
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  # GitHub larger runner: weekly sweep and workflow_dispatch backend=github.
  # PR runs use HF Jobs (test-models-hf) — issue #20 milestone 4.
  test-models:
    name: Test models
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.backend == 'github')
    runs-on: linux-cpu8-300g
    steps:
      - name: Check User Permission
        id: checkAccess
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.triggering_actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abort if unauthorized
        if: steps.checkAccess.outputs.require-result == 'false'
        run: |
          echo "${{ github.triggering_actor }} does not have permissions on this repo."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Needed so `git diff <base>...HEAD` can resolve the merge base.
          fetch-depth: 0

      # Only the full run touches the cache. A pull request tests just the
      # models it changed — which, being new, are not in the cache anyway — so
      # restoring ~50 GB there costs several minutes and buys nothing.
      - name: Restore HuggingFace cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ github.run_id }}
          restore-keys: hf-models

      - name: Set up uv
        # astral-sh publishes immutable releases and no longer moves major
        # tags, so this must be an exact version — `@v10` does not exist.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml

      - name: Install development dependencies
        run: uv sync --dev --group model

      - name: Show transformers version
        run: uv run --no-sync python -c "import transformers; print(f'transformers=={transformers.__version__}')"

      # Scheduled and backend=github always test everything. PR selection
      # lives on the HF Jobs job.
      - name: Run model tests
        run: |
          uv run --no-sync pytest tests/ \
            -n auto \
            --dist loadgroup \
            --maxfail=3 \
            --cov=lazyslide_models \
            --cov-report=xml \
            -v

      - name: Save HuggingFace cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ github.run_id }}

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: models

  # Hugging Face Jobs: pull requests and workflow_dispatch backend=hf-jobs.
  test-models-hf:
    name: Test models (HF Jobs)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.backend == 'hf-jobs')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check User Permission
        id: checkAccess
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.triggering_actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abort if unauthorized
        if: steps.checkAccess.outputs.require-result == 'false'
        run: |
          echo "${{ github.triggering_actor }} does not have permissions on this repo."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Needed so a PR can `git diff base...HEAD` to pick the Job flavor.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Run model tests on Hugging Face Jobs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN secret is empty; cannot start a Job." >&2
            exit 1
          fi
          SHA="${{ github.sha }}"
          PYTEST_ARGS=""
          BASE_SHA=""
          FLAVOR=cpu-upgrade
          JOB_TIMEOUT=30m
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            PYTEST_ARGS="--changed-since ${BASE_SHA}"
            # tests/, packaging, or core modules select the whole registry
            # (#19 fail-safe). That does not fit in cpu-upgrade's 32 GB.
            if git diff --name-only "${BASE_SHA}...HEAD" | grep -E -q \
              '^(tests/|pyproject.toml|uv.lock|src/lazyslide_models/(base|_model_registry|_repr|_utils|_version|__init__)\.py)'; then
              FLAVOR=cpu-xl
              JOB_TIMEOUT=60m
            fi
          else
            SHA="${{ github.event.inputs.sha }}"
            if [ -z "${SHA}" ]; then
              SHA="${{ github.sha }}"
            fi
            MODELS="${{ github.event.inputs.models }}"
            if [ -n "${MODELS}" ]; then
              PYTEST_ARGS="--models ${MODELS}"
            fi
          fi
          echo "HF Jobs flavor=${FLAVOR} timeout=${JOB_TIMEOUT} sha=${SHA}"
          uvx --from huggingface_hub hf jobs run \
            --namespace RendeiroLab \
            --flavor "${FLAVOR}" \
            --timeout "${JOB_TIMEOUT}" \
            --secrets HF_TOKEN \
            --env "CI_SHA=${SHA}" \
            --env "CI_BASE_SHA=${BASE_SHA}" \
            --env "CI_PYTEST_ARGS=${PYTEST_ARGS}" \
            ghcr.io/astral-sh/uv:python3.12-bookworm \
            bash -c "$(cat scripts/ci_hf_job.sh)"
