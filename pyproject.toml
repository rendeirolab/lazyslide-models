[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "lazyslide-models"
description = "The model zoo for LazySlide"
readme = "README.md"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yimin Zheng", email = "yzheng@cemm.at" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=2.0.0",
    "timm>=1.0.3",
    "torch>=2.1.0",
    "transformers>=4.49.0",
    "pandas",
    "opencv-python-headless",
    "scipy",
    "scikit-image",
    "platformdirs"
]

[dependency-groups]
dev = [
    "hf-xet>=1.5.0",
    "prek>=0.3.13",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.0",
    "ruff>=0.16.4",
    "taskipy>=1.14.1",
]
model = [
    "einops>=0.8.1",
    "einops-exts>=0.0.4",
    "environs>=14.1.1",
    "sacremoses>=0.1.1",
    "conch",
    "open-clip-torch>=2.32.0",
    "cellpose>=4.0.0",
    "musk",
    "fairscale>=0.4.13",
    "sentencepiece>=0.2.1",
    "diffusers>=0.36.0",
    "accelerate>=1.12.0",
    "gigapath",
    "protobuf",
    "moozy",
    "deepspotm"
]

[tool.uv]
default-groups = ["dev", "model"]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true }}]

[tool.uv.sources]
conch = { git = "https://github.com/mahmoodlab/CONCH.git" }
musk = { git = "https://github.com/lilab-stanford/MUSK.git" }
gigapath = { git = "https://github.com/prov-gigapath/prov-gigapath.git" }
deepspotm = { git = "https://github.com/ratschlab/DeepSpotM.git" }

[tool.taskipy.tasks]
test = "pytest tests -v --tb=short"
test-ci = "pytest tests -n 4 --dist loadgroup -v --tb=short --cov=src/lazyslide_models --cov-report=xml --cov-report=html"
fmt = "ruff format src/lazyslide_models tests"

[tool.pytest.ini_options]
markers = [
    "gated: model behind a gated HuggingFace repo",
    "slow: large or slow-to-load model",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lazyslide_models"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "src/lazyslide_models/_version.py"
template = '''
version = "{version}"
'''

[tool.ruff]
lint.extend-select = ["I"]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# These are one-off reproduction scripts that vendor upstream model code
# verbatim; they are not part of the shipped package and are not linted for
# style beyond syntax.
"scripts/export_models/*.py" = [
    "E402",    # imports after sys.path / config setup
    "B008",    # function call in argument default (upstream code)
    "BLE001",  # blind `except Exception` (upstream code)
    "EXE001",  # shebang without the executable bit
    "RUF012",  # mutable class default (upstream code)
    "RUF013",  # implicit Optional (upstream code)
    "RUF059",  # unused unpacked variable (upstream code)
]
# The `load_model` fixture must skip on *any* load failure — a missing optional
# dependency, a gated repo, an upstream incompatibility — so a blind catch is
# the point, not an oversight.
"tests/conftest.py" = ["BLE001", "S110"]